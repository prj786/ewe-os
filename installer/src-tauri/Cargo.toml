[package]
name = "ewe-installer"
version = "0.1.0"
description = "The ewe OS installer"
authors = ["scubba"]
license = "MIT"
edition = "2021"

[lib]
name = "ewe_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
