[Unit]
After=ewe-live-user.service
Wants=ewe-live-user.service
# tty1 is the VT plymouth leaves behind — a getty there flashes a root
# prompt + motd before greetd chvt's away. The rescue console lives on
# tty3 instead (Ctrl+Alt+F3); nothing may claim tty1's screen.
Conflicts=getty@tty1.service
After=getty@tty1.service
