# Masks /usr/lib/modules-load.d/nvidia-utils.conf (nvidia-utils lands on the
# live ISO as a dependency). It lists nvidia_uvm unconditionally, so every
# machine without the NVIDIA module logged "Failed to find module
# 'nvidia_uvm'" at boot (QEMU pass, 2026-09-02). The live session needs
# nothing from that file: the KMS module is loaded by udev when the hardware
# is present, and nvidia_uvm is CUDA-only. Same-named file in /etc wins.
